
<!DOCTYPE html>
<html>

<head>
    <title>Signup Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <form method="post">

        <div>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Name" required>
        </div>

        <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Email" required>
        </div>

        <div>
            <p>Gender</p>
            <label for="gender_m">Male</label>
            <input id="gender_m" type="radio" name="gender" value="male" required>

            <label for="gender_f">Female</label>
            <input id="gender_f" type="radio" name="gender" value="female" required>
        </div>

        <div>
            <label for="cars">Car Brands</label>
            <select id="cars" name="car_brands" required>
                <option value="">--Please choose an option--</option>
                <option value="Toyota">Toyota</option>
                <option value="BMW">BMW</option>
                <option value="Mercedes">Mercedes</option>
                <option value="Alto">Lord Alto</option>
            </select>
        </div>

        <div>
            <label for="age">Age</label>
            <input id="age" name="age" type="number" placeholder="Age" required>
        </div>

        <div>
            <label for="dob">DOB</label>
            <input id="dob" name="dob" type="date" required>
        </div>

        <div>
            <label for="tel">Phone Number</label>
            <input id="tel" name="tel" type="tel" placeholder="xxx-xxx-xxxx">
        </div>

        <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Password" required>
        </div>

        <div>
            <label for="tos">I agree to the TOS</label>
            <input id="tos" type="checkbox" name="tos" value="yes" required>
        </div>

        <button type="submit">Submit</button>

    </form>

    <script src="./script.js"></script>

</body>
</html>
